
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My Video Tools</title>
<style>
* { box-sizing: border-box; }
body {
  margin: 0; padding: 24px 16px;
  font-family: system-ui, sans-serif;
  background: #10131b; color: #f5f5f5;
}
main {
  max-width: 680px; margin: 40px auto;
  background: #1c2230; padding: 24px;
  border-radius: 18px;
}
h1 { font-size: 26px; }
p { color: #b8c2d6; line-height: 1.6; }
input, button {
  width: 100%; padding: 14px; margin-top: 10px;
  border-radius: 10px; font-size: 16px;
}
input { border: 1px solid #48536a; background: #10131b; color: white; }
button { border: 0; background: #6c8cff; color: white; }
video, iframe {
  width: 100%; margin-top: 20px;
  border: 0; border-radius: 12px;
}
a { color: #a9c0ff; overflow-wrap: anywhere; }
#result { margin-top: 20px; }
</style>
</head>
<body>
<main>
  <h1>My Video Tools</h1>
  <p>動画URLを入力して、対応する動画を表示します。</p>
  <input id="url" type="url"
    placeholder="動画URLを入力してください">
  <button id="check">URLを解析</button>
  <div id="result" aria-live="polite"></div>
  
<section id="uploadSection"
  style="margin-top:30px;padding:18px;
  background:#252d3d;border-radius:14px;">

  <h2>MP4ファイルをアップロード</h2>

  <p>iPad内の動画ファイルを選択してください。</p>

  <input
    type="file"
    id="mp4File"
    accept="video/mp4,.mp4"
    style="display:block;width:100%;margin:16px 0;"
  >

  <p id="fileInfo" aria-live="polite">
    まだ動画が選択されていません。
  </p>

  <video
    id="uploadedVideo"
    controls
    playsinline
    style="display:none;width:100%;
    margin-top:16px;border-radius:12px;">
  </video>

  <a
    id="downloadMP4"
    style="display:none;margin-top:16px;"
    download>
    MP4ファイルを保存
  </a>

</section>

</main>

<script>
const input = document.getElementById("url");
const result = document.getElementById("result");

document.getElementById("check").onclick = () => {
  result.replaceChildren();

  let u;
  try {
    u = new URL(input.value.trim());
    if (!["https:", "http:"].includes(u.protocol)) {
      throw new Error();
    }
  } catch {
    result.textContent = "正しいURLを入力してください。";
    return;
  }

  const msg = document.createElement("p");
  result.appendChild(msg);

  if (u.hostname === "youtu.be" ||
      ["youtube.com", "www.youtube.com",
       "m.youtube.com", "youtube-nocookie.com",
       "www.youtube-nocookie.com"].includes(u.hostname)) {

    let id = "";
    if (u.hostname === "youtu.be") {
      id = u.pathname.split("/").filter(Boolean)[0] || "";
    } else if (u.pathname === "/watch") {
      id = u.searchParams.get("v") || "";
    } else if (/^\/(embed|shorts)\/[^/]+/.test(u.pathname)) {
      id = u.pathname.split("/")[2];
    }

    if (!/^[\w-]{11}$/.test(id)) {
      msg.textContent = "動画URLを認識できませんでした。";
      return;
    }

    msg.textContent =
      "YouTube動画です。以下で公式プレーヤーを表示します。";

const info = document.createElement("div");
info.style.marginTop = "16px";

const thumbnail = document.createElement("img");
thumbnail.src =
  "https://i.ytimg.com/vi/" + id + "/hqdefault.jpg";
thumbnail.alt = "動画のサムネイル";
thumbnail.style.width = "100%";
thumbnail.style.borderRadius = "12px";
thumbnail.style.display = "block";

const videoId = document.createElement("p");
videoId.textContent = "動画ID: " + id;

info.appendChild(thumbnail);
info.appendChild(videoId);
result.appendChild(info);

    const frame = document.createElement("iframe");
    frame.src = "https://www.youtube-nocookie.com/embed/" + id;
    frame.title = "YouTube動画プレーヤー";
    frame.allow =
      "accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture";
    frame.allowFullscreen = true;
    frame.referrerPolicy = "strict-origin-when-cross-origin";
    result.appendChild(frame);

    const note = document.createElement("p");
    note.textContent =
      "MP4ファイルが必要な場合は、投稿者が提供するファイルや公式のダウンロード機能を利用してください。";
    result.appendChild(note);
    return;
  }

  if (!["http:", "https:"].includes(u.protocol)) {
    msg.textContent = "このURL形式には対応していません。";
    return;
  }

  if (!/\.mp4$/i.test(u.pathname)) {
    msg.textContent =
      "直接MP4ファイルのURLではないようです。";
    return;
  }

  msg.textContent = "MP4への直接リンクを確認しました。";

  const video = document.createElement("video");
  video.controls = true;
  video.playsInline = true;
  video.preload = "metadata";
  video.src = u.href;
  result.appendChild(video);

  const link = document.createElement("a");
  link.href = u.href;
  link.target = "_blank";
  link.rel = "noopener noreferrer";
  link.textContent = "MP4ファイルを開く";
  result.appendChild(document.createElement("br"));
  result.appendChild(link);
};

</script>

<script>
const mp4File = document.getElementById("mp4File");
const uploadedVideo =
  document.getElementById("uploadedVideo");
const fileInfo = document.getElementById("fileInfo");
const downloadMP4 =
  document.getElementById("downloadMP4");

let currentVideoURL = null;

mp4File.addEventListener("change", () => {
  const file = mp4File.files[0];

  if (!file) return;

  const isMP4 =
    file.type === "video/mp4" ||
    /\.mp4$/i.test(file.name);

  if (!isMP4) {
    fileInfo.textContent =
      "MP4ファイルを選択してください。";
    mp4File.value = "";
    return;
  }

  if (currentVideoURL) {
    URL.revokeObjectURL(currentVideoURL);
  }

  currentVideoURL = URL.createObjectURL(file);

  uploadedVideo.src = currentVideoURL;
  uploadedVideo.style.display = "block";

  fileInfo.textContent =
    "ファイル名: " + file.name +
    " / サイズ: " +
    (file.size / (1024 * 1024)).toFixed(2) +
    " MB";

  downloadMP4.href = currentVideoURL;
  downloadMP4.download = file.name;
  downloadMP4.style.display = "inline-block";
  downloadMP4.textContent = "MP4ファイルを保存";
});

</script>
</body>
</html>
